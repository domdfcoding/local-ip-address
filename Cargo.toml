[package]
name = "py-local-ip-address"
version = "0.1.0"
edition = "2024"
description = "Wrapper around notify-rust to show desktop notifications."
license = "MIT"
homepage = "https://github.com/domdfcoding/local-ip-address"
repository = "https://github.com/domdfcoding/local-ip-address"
# TODO: documentation

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "local_ip_address"
crate-type = ["cdylib"]

[dependencies]
local-ip-address = "0.6.13"
pyo3 = { version = "0.29.0", features = ["extension-module", "experimental-inspect", ] }
